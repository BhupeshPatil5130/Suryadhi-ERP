# Render Blueprint for SEMS ERP
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ─── Full-stack Web Service (Frontend + Backend API) ─────────────
  - type: web
    name: sems-erp
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run render-build
    startCommand: npm run render-start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: sems-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 500

databases:
  # ─── PostgreSQL Database ──────────────────────────────────────────
  - name: sems-postgres
    plan: free
    region: oregon
    databaseName: sems_db
    user: sems_admin
